<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="syrup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="70%" stop-color="#F2E6CE"/>
      <stop offset="100%" stop-color="#E2CCA6"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#7B6143" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Bát sứ nhỏ -->
  <circle cx="50" cy="50" r="46" fill="#FBF7F0" stroke="#E2CCA6" stroke-width="2"/>
  <circle cx="50" cy="50" r="40" fill="url(#syrup)"/>
  
  <!-- Các khối thạch Khúc Bạch phô mai vuông vắn núng nính -->
  <g filter="url(#shadow)">
    <!-- Khối trắng phô mai 1 -->
    <rect x="24" y="28" width="22" height="20" rx="3" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1"/>
    <!-- Khối phô mai vàng nhạt 2 -->
    <rect x="44" y="24" width="24" height="22" rx="3" fill="#FFFBE6" stroke="#E5DEC9" stroke-width="1"/>
    <!-- Khối trà xanh 3 -->
    <rect x="30" y="46" width="22" height="20" rx="3" fill="#E2F0D9" stroke="#B8D8A0" stroke-width="1"/>
    <!-- Khối dâu hồng 4 -->
    <rect x="52" y="44" width="24" height="22" rx="3" fill="#FFEAEB" stroke="#F5C6CB" stroke-width="1"/>
  </g>
  
  <!-- Hạnh nhân lát nướng vàng giòn rắc lên -->
  <ellipse cx="38" cy="36" rx="4" ry="2" fill="#D4A373" transform="rotate(-20 38 36)"/>
  <ellipse cx="58" cy="32" rx="4.5" ry="2" fill="#C68B59" transform="rotate(35 58 32)"/>
  <ellipse cx="44" cy="54" rx="4" ry="2" fill="#D4A373" transform="rotate(15 44 54)"/>
  <ellipse cx="64" cy="50" rx="4.5" ry="2" fill="#C68B59" transform="rotate(-40 64 50)"/>
  <!-- Hạt chia điểm xuyết -->
  <circle cx="32" cy="42" r="0.8" fill="#4A3B32"/>
  <circle cx="48" cy="40" r="0.8" fill="#4A3B32"/>
  <circle cx="60" cy="42" r="0.8" fill="#4A3B32"/>
  <circle cx="42" cy="48" r="0.8" fill="#4A3B32"/>
</svg>

