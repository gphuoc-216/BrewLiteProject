<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="peachSyrup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5E5"/>
      <stop offset="60%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </radialGradient>
    <linearGradient id="peachSlice1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB91"/>
      <stop offset="40%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </linearGradient>
    <linearGradient id="peachSlice2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="60%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <filter id="peachGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#D87A24" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Bát sứ trắng kem -->
  <circle cx="50" cy="50" r="46" fill="#FBF7F0" stroke="#E2CCA6" stroke-width="2"/>
  <circle cx="50" cy="50" r="40" fill="url(#peachSyrup)"/>
  
  <!-- Các miếng đào giòn ngâm vàng cam căng mọng -->
  <g filter="url(#peachGlow)">
    <!-- Miếng đào 1 (cong hình bán nguyệt) -->
    <path d="M 28 55 C 24 35 45 22 66 28 C 55 36 44 48 38 64 C 33 62 30 59 28 55 Z" fill="url(#peachSlice1)"/>
    <!-- Vỏ viền hồng đào tự nhiên -->
    <path d="M 28 55 C 24 35 45 22 66 28" fill="none" stroke="#E64A19" stroke-width="2" opacity="0.6"/>

    <!-- Miếng đào 2 (nghiêng đối diện) -->
    <path d="M 40 70 C 58 75 75 60 72 38 C 66 48 55 58 40 64 C 39 67 40 69 40 70 Z" fill="url(#peachSlice2)"/>
    <path d="M 40 70 C 58 75 75 60 72 38" fill="none" stroke="#E64A19" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Khối thạch đào vuông trong veo -->
  <rect x="42" y="38" width="16" height="15" rx="3" fill="#FFE082" opacity="0.8" stroke="#FFCA28" stroke-width="1"/>
  <!-- Điểm sáng óng ánh mọng nước trên miếng đào -->
  <ellipse cx="44" cy="34" rx="5" ry="2" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 44 34)"/>
  <ellipse cx="58" cy="52" rx="4" ry="1.8" fill="#FFFFFF" opacity="0.6" transform="rotate(20 58 52)"/>

  <!-- Nhành lá bạc hà xanh mát trang trí -->
  <path d="M 62 26 C 68 20 76 22 75 29 C 69 32 63 30 62 26 Z" fill="#4CAF50"/>
  <path d="M 64 27 L 72 25" stroke="#2E7D32" stroke-width="0.8"/>
</svg>

