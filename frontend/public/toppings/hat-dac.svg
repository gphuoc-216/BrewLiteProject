<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="dacSyrup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="60%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>
    <radialGradient id="dacSeed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="40%" stop-color="#FFE082"/>
      <stop offset="80%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </radialGradient>
    <filter id="dacShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#E65100" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Bát sứ trắng kem -->
  <circle cx="50" cy="50" r="46" fill="#FBF7F0" stroke="#E2CCA6" stroke-width="2"/>
  <circle cx="50" cy="50" r="40" fill="url(#dacSyrup)"/>

  <!-- Từng hạt đác rừng dẻo dai rim đường phèn óng ả -->
  <g filter="url(#dacShadow)">
    <ellipse cx="36" cy="40" rx="14" ry="9" fill="url(#dacSeed)" transform="rotate(-25 36 40)"/>
    <ellipse cx="64" cy="42" rx="13" ry="8.5" fill="url(#dacSeed)" transform="rotate(35 64 42)"/>
    <ellipse cx="50" cy="55" rx="15" ry="10" fill="url(#dacSeed)" transform="rotate(5 50 55)"/>
    <ellipse cx="33" cy="67" rx="13" ry="8.5" fill="url(#dacSeed)" transform="rotate(40 33 67)"/>
    <ellipse cx="65" cy="66" rx="14" ry="9" fill="url(#dacSeed)" transform="rotate(-30 65 66)"/>
  </g>

  <!-- Lớp đường phèn óng ánh mọng nước -->
  <ellipse cx="34" cy="37" rx="6" ry="2.5" fill="#FFFFFF" opacity="0.75" transform="rotate(-25 34 37)"/>
  <ellipse cx="63" cy="39" rx="5.5" ry="2.2" fill="#FFFFFF" opacity="0.75" transform="rotate(35 63 39)"/>
  <ellipse cx="48" cy="52" rx="7" ry="2.8" fill="#FFFFFF" opacity="0.8" transform="rotate(5 48 52)"/>
  <ellipse cx="31" cy="64" rx="5" ry="2" fill="#FFFFFF" opacity="0.7" transform="rotate(40 31 64)"/>
  <ellipse cx="63" cy="63" rx="5.5" ry="2.2" fill="#FFFFFF" opacity="0.7" transform="rotate(-30 63 63)"/>

  <!-- Vệt siro đường phèn dẻo quánh -->
  <path d="M 46 32 Q 52 45 48 55" stroke="#FFA000" stroke-width="2.5" fill="none" opacity="0.7"/>
</svg>

