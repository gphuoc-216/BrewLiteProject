<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="cremaGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E8A857"/>
      <stop offset="50%" stop-color="#C27A2D"/>
      <stop offset="85%" stop-color="#7B4112"/>
      <stop offset="100%" stop-color="#3D1D05"/>
    </radialGradient>
    <radialGradient id="espressoDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A2610"/>
      <stop offset="70%" stop-color="#281307"/>
      <stop offset="100%" stop-color="#120702"/>
    </radialGradient>
  </defs>
  <!-- Đĩa lót sứ trắng -->
  <circle cx="50" cy="50" r="46" fill="#FBF7F0" stroke="#E2CCA6" stroke-width="2"/>
  <!-- Vành tách sứ trắng sang trọng -->
  <circle cx="50" cy="50" r="39" fill="#FFFFFF" stroke="#E0D7C9" stroke-width="3"/>
  <circle cx="50" cy="50" r="35" fill="url(#espressoDark)"/>
  
  <!-- Lớp Crema vàng nâu sóng sánh của cà phê pha máy -->
  <circle cx="50" cy="50" r="32" fill="url(#cremaGrad)"/>
  
  <!-- Vân Crema Tiger Stripes đặc trưng của espresso chuẩn -->
  <path d="M 32 45 Q 42 40 48 47 T 64 42" stroke="#5C2E0B" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 38 56 Q 48 52 56 58 T 68 52" stroke="#5C2E0B" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 42 35 Q 52 38 60 33" stroke="#FFE1B3" stroke-width="1.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Vệt sáng phản chiếu bề mặt óng ả -->
  <ellipse cx="38" cy="36" rx="6" ry="3" fill="#FFFFFF" opacity="0.4" transform="rotate(-30 38 36)"/>
  <!-- Hạt bọt khí crema li ti -->
  <circle cx="58" cy="45" r="1.2" fill="#FFE5C4" opacity="0.8"/>
  <circle cx="62" cy="48" r="0.9" fill="#FFE5C4" opacity="0.7"/>
  <circle cx="45" cy="58" r="1" fill="#FFE5C4" opacity="0.7"/>
</svg>

