<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="aloeSyrup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F1F8E9"/>
      <stop offset="70%" stop-color="#DCEDC8"/>
      <stop offset="100%" stop-color="#C5E1A5"/>
    </radialGradient>
    <linearGradient id="aloeCube1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
    <filter id="aloeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#558B2F" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Bát sứ trắng kem -->
  <circle cx="50" cy="50" r="46" fill="#FBF7F0" stroke="#E2CCA6" stroke-width="2"/>
  <circle cx="50" cy="50" r="40" fill="url(#aloeSyrup)"/>

  <!-- Lá nha đam tươi có răng cưa nhỏ ở góc -->
  <path d="M 22 75 C 26 50 42 30 72 20 C 62 38 52 58 40 78 Z" fill="#43A047" opacity="0.85"/>
  <path d="M 24 73 C 28 52 42 34 68 24" fill="none" stroke="#2E7D32" stroke-width="1.5"/>

  <!-- Các khối thạch nha đam hạt lựu trong vắt mọng nước -->
  <g filter="url(#aloeGlow)">
    <rect x="36" y="36" width="18" height="16" rx="3" fill="url(#aloeCube1)" stroke="#A5D6A7" stroke-width="1.2" opacity="0.9"/>
    <rect x="52" y="44" width="20" height="18" rx="3" fill="url(#aloeCube1)" stroke="#A5D6A7" stroke-width="1.2" opacity="0.9"/>
    <rect x="30" y="52" width="17" height="15" rx="3" fill="url(#aloeCube1)" stroke="#A5D6A7" stroke-width="1.2" opacity="0.9"/>
    <rect x="44" y="62" width="18" height="15" rx="3" fill="url(#aloeCube1)" stroke="#A5D6A7" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- Ánh sáng phản chiếu óng ánh (crystal glass gleam) -->
  <polygon points="38,39 48,39 40,49" fill="#FFFFFF" opacity="0.7"/>
  <polygon points="54,47 66,47 57,59" fill="#FFFFFF" opacity="0.7"/>
  <polygon points="32,55 42,55 35,63" fill="#FFFFFF" opacity="0.7"/>
  <polygon points="46,65 56,65 49,73" fill="#FFFFFF" opacity="0.7"/>

  <!-- Giọt nước thanh khiết đọng lại -->
  <circle cx="68" cy="38" r="2.5" fill="#E8F5E9" stroke="#81C784" stroke-width="0.8"/>
  <circle cx="67" cy="37" r="0.8" fill="#FFFFFF"/>
</svg>

