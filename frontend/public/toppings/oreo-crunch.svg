<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="oreoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="70%" stop-color="#F2E6CE"/>
      <stop offset="100%" stop-color="#E2CCA6"/>
    </radialGradient>
    <filter id="cookieShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#1A0D07" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Bát sứ trắng kem -->
  <circle cx="50" cy="50" r="46" fill="#FBF7F0" stroke="#E2CCA6" stroke-width="2"/>
  <circle cx="50" cy="50" r="40" fill="url(#oreoBg)"/>

  <!-- Nửa chiếc bánh Oreo nguyên bản nghiêng góc -->
  <g filter="url(#cookieShadow)">
    <path d="M 24 50 A 24 24 0 0 1 66 26 L 46 66 A 24 24 0 0 1 24 50 Z" fill="#221C19"/>
    <!-- Lớp kem trắng sữa Oreo kẹp giữa -->
    <path d="M 28 50 A 20 20 0 0 1 63 30" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Vỏ bánh nâu sẫm trên -->
    <path d="M 26 48 A 22 22 0 0 1 64 27" stroke="#181311" stroke-width="2" fill="none"/>
    <!-- Hoa văn dập nổi bánh Oreo -->
    <circle cx="42" cy="38" r="2" fill="#3D3430"/>
    <circle cx="34" cy="44" r="1.5" fill="#3D3430"/>
    <circle cx="50" cy="32" r="1.5" fill="#3D3430"/>
  </g>

  <!-- Các mảnh vụn bánh Oreo giòn rụm (Oreo crumbles) rắc xung quanh -->
  <g fill="#241C18" filter="url(#cookieShadow)">
    <polygon points="62,54 70,50 68,60 59,58"/>
    <polygon points="48,72 56,66 54,76 45,74"/>
    <polygon points="32,68 38,64 36,73 30,71"/>
    <polygon points="72,40 78,38 76,46 70,44"/>
    <polygon points="68,66 74,64 72,70 66,69"/>
    <rect x="58" y="44" width="4" height="4" rx="1"/>
    <circle cx="40" cy="62" r="2.5"/>
    <circle cx="62" cy="64" r="2"/>
    <circle cx="52" cy="60" r="1.8"/>
    <circle cx="76" cy="56" r="1.5"/>
    <circle cx="34" cy="58" r="1.5"/>
  </g>
  <!-- Vụn kem vani trắng rải rác -->
  <ellipse cx="64" cy="57" rx="2" ry="1.2" fill="#FFFFFF"/>
  <ellipse cx="50" cy="70" rx="1.8" ry="1" fill="#FFFFFF"/>
  <ellipse cx="73" cy="42" rx="1.5" ry="1" fill="#FFFFFF"/>
</svg>

